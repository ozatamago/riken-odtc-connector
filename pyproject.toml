[project]
name = "riken-odtc-connector"
version = "0.1.0"
description = "SiLA 2 connector for the Inheco ODTC 96 on the RIKEN BDR Tecan Fluent 780, built with the UniteLabs CDK"
readme = "README.md"
authors = [
    { name = "Yusuke Ozaki", email = "109056512+ozatamago@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pylabrobot[usb]",
    "sila2==0.14.0",
    "unitelabs-cdk~=0.13.6",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
pylabrobot = { git = "https://github.com/PyLabRobot/pylabrobot.git", rev = "183cabd61fd37b97375c97f136a9eca5252ce2b8" }
